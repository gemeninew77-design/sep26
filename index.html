<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تركيب الصورة في قالب 26 سبتمبر | شرطة حراسة المنشآت - مأرب</title>
  <style>
    :root {
      --primary: #B15433;
      --primary-hover: #8C3E22;
      --accent: #F7B839;
      --accent-light: #FFF7E6;
      --bg: #FDFBF8;
      --card-bg: #FFFFFF;
      --text: #2D2622;
      --text-muted: #6E635D;
      --border: #E8DFD7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', 'Noto Sans Arabic', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 30px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* الترويسة */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #FFFFFF;
      border-bottom: 3px solid var(--accent);
      box-shadow: 0 4px 14px rgba(177, 84, 51, 0.16);
    }

    .header-logo {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.25));
    }

    .header-info h1 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      color: #FFFFFF;
    }

    .header-info p {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }

    /* بطاقة العمل */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* مساحة الكانفاس والمعاينة */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #F4EFEB;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      touch-action: none;
      user-select: none;
    }

    .canvas-wrapper.interactive {
      cursor: grab;
    }

    .canvas-wrapper.interactive:active {
      cursor: grabbing;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .guide-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(253, 251, 248, 0.88);
      backdrop-filter: blur(2px);
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 600;
      pointer-events: none;
      text-align: center;
      padding: 20px;
      transition: opacity 0.25s ease;
    }

    .guide-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .guide-overlay svg {
      width: 44px;
      height: 44px;
      stroke: var(--primary);
    }

    /* أزرار الإجراءات */
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(177, 84, 51, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-accent {
      background: var(--accent);
      color: #2D1E04;
      box-shadow: 0 3px 10px rgba(247, 184, 57, 0.3);
    }

    .btn-accent:hover:not(:disabled) {
      filter: brightness(0.95);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.8rem;
      background: var(--accent-light);
      color: var(--primary);
      border: 1px solid rgba(177, 84, 51, 0.18);
    }

    /* لوحة التحكم والتحريك */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #FAF7F2;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .control-title {
      font-size: 0.82rem;
      font-weight: 600;
      min-width: 60px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      accent-color: var(--primary);
      background: #E2DBD4;
      outline: none;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .icon-btn:hover {
      background: var(--accent-light);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .text-link {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-size: inherit;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- عناصر الاستدعاء التلقائي في DOM -->
  <img id="domLogo" src="logo.png" style="display:none;" onerror="tryNextLogo(this)">
  <img id="domTemplate" src="1000702244.png" style="display:none;" onerror="tryNextTemplate(this)">

  <div class="container">
    <!-- الترويسة -->
    <header class="header">
      <img src="logo.png" alt="شعار شرطة حراسة المنشآت وحماية الشخصيات" class="header-logo" id="headerLogoDisplay" onerror="tryNextLogoDisplay(this)">
      <div class="header-info">
        <h1>شرطة حراسة المنشآت وحماية الشخصيات</h1>
        <p>فرع م / مأرب - قالب الاحتفاء بالعيد 64 لثورة 26 سبتمبر</p>
      </div>
    </header>

    <!-- البطاقة الرئيسية -->
    <main class="card">
      <div class="canvas-wrapper interactive" id="canvasWrapper">
        <canvas id="mainCanvas" width="1080" height="1080"></canvas>
        <div class="guide-overlay" id="guideOverlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span id="guideText">اضغط "اختيار صورتك الشخصية" للبدء</span>
        </div>
      </div>

      <div class="hint" id="dragHint" style="display:none;">
        💡 يمكنك تحريك صورتك وتوسيطها داخل الدائرة بالسحب المباشر
      </div>

      <!-- أزرار الإجراءات -->
      <div class="actions">
        <input type="file" id="userPhotoInput" accept="image/*">
        <button type="button" class="btn btn-primary" onclick="document.getElementById('userPhotoInput').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          اختيار صورتك الشخصية
        </button>

        <button type="button" class="btn btn-accent" id="downloadBtn" onclick="downloadFinalImage()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          تنزيل النتيجة مباشرة
        </button>
      </div>

      <!-- عناصر التحكم بالصورة -->
      <div class="controls-panel" id="controlsPanel" style="display:none;">
        <div class="control-item">
          <span class="control-title">التكبير:</span>
          <input type="range" id="zoomSlider" min="0.1" max="4" step="0.01" value="1">
          <button class="icon-btn" onclick="stepZoom(-0.1)">-</button>
          <button class="icon-btn" onclick="stepZoom(0.1)">+</button>
        </div>

        <div class="control-item">
          <span class="control-title">التدوير:</span>
          <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
          <button class="icon-btn" onclick="resetRotation()" title="استعادة التدوير">↺</button>
        </div>

        <div class="control-item" style="justify-content: flex-end; gap: 8px;">
          <button class="btn btn-small" onclick="centerImage()">محاذاة في المنتصف</button>
          <button class="btn btn-small" onclick="resetAll()">إعادة ضبط</button>
        </div>
      </div>

      <!-- شريط حالة القالب -->
      <div class="status-bar">
        <span>القالب: <strong id="templateStatusText" style="color:var(--primary);">جاري الفحص...</strong></span>
        <input type="file" id="templateFileInput" accept="image/*">
        <button type="button" class="text-link" onclick="document.getElementById('templateFileInput').click()">تبديل القالب يدوياً</button>
      </div>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const userPhotoInput = document.getElementById('userPhotoInput');
    const templateFileInput = document.getElementById('templateFileInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const controlsPanel = document.getElementById('controlsPanel');
    const guideOverlay = document.getElementById('guideOverlay');
    const dragHint = document.getElementById('dragHint');
    const zoomSlider = document.getElementById('zoomSlider');
    const rotateSlider = document.getElementById('rotateSlider');
    const templateStatusText = document.getElementById('templateStatusText');

    // إحداثيات وموضع الدائرة الحقيقي في القالب
    // تم خفض المركز قليلاً إلى Y=390 وزيادة قطر التغطية إلى 480 ليملأ الفراغ بالكامل ويمتد خلف الخريطة
    const targetCircle = {
      centerX: 500,
      centerY: 390,
      diameter: 480
    };

    let userPhoto = null;
    let templateImage = null;

    let photoTransform = {
      x: targetCircle.centerX,
      y: targetCircle.centerY,
      scale: 1,
      rotation: 0
    };

    // أسماء ملفات القالب المدعومة للاستدعاء التلقائي
    const templateCandidateNames = [
      '1000702244.png',
      '1000702244.jpg',
      '1000702139.png',
      '1000702139.jpg',
      '1000701490.png',
      '1000701490.jpg',
      'template.png',
      'template.jpg',
      '1000701392.png',
      '1000701339.png',
      'قالب.png'
    ];
    let templateCandidateIndex = 0;

    const logoCandidateNames = [
      'logo.png',
      '1000700123.png',
      'logo.jpg',
      '1000700123.jpg'
    ];
    let logoCandidateIndex = 0;

    function tryNextTemplate(imgElement) {
      templateCandidateIndex++;
      if (templateCandidateIndex < templateCandidateNames.length) {
        imgElement.src = templateCandidateNames[templateCandidateIndex];
      } else {
        templateStatusText.textContent = 'حدد ملف القالب';
      }
    }

    function tryNextLogo(imgElement) {
      logoCandidateIndex++;
      if (logoCandidateIndex < logoCandidateNames.length) {
        imgElement.src = logoCandidateNames[logoCandidateIndex];
      }
    }

    function tryNextLogoDisplay(imgElement) {
      const idx = (imgElement._idx || 0) + 1;
      imgElement._idx = idx;
      if (idx < logoCandidateNames.length) {
        imgElement.src = logoCandidateNames[idx];
      }
    }

    // تعيين القالب مباشرة مع الحفاظ على شفافيته الطبيعية
    function setTemplate(img) {
      templateImage = img;
      templateStatusText.textContent = 'تم استيراد القالب الجديد بنجاح';
      render();
    }

    const domTemplate = document.getElementById('domTemplate');
    domTemplate.onload = () => {
      setTemplate(domTemplate);
    };
    if (domTemplate.complete && domTemplate.naturalWidth > 0) {
      setTemplate(domTemplate);
    }

    // استيراد القالب يدوياً عند الحاجة
    templateFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          setTemplate(img);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // اختيار الصورة الشخصية
    userPhotoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          userPhoto = img;
          // ضبط مقاس أولي يغطي كامل الفتحة الدائرية ويمتد خلف الخريطة لمنع ظهور أي هلال أو فراغ
          const fit = Math.max(targetCircle.diameter / img.width, targetCircle.diameter / img.height);
          photoTransform.scale = fit * 1.15; // مقاس وافر لملء الفراغ بالكامل
          photoTransform.x = targetCircle.centerX;
          photoTransform.y = targetCircle.centerY;
          photoTransform.rotation = 0;

          zoomSlider.value = photoTransform.scale;
          rotateSlider.value = 0;

          guideOverlay.classList.add('hidden');
          dragHint.style.display = 'block';
          controlsPanel.style.display = 'flex';
          downloadBtn.disabled = false;

          render();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // رسم المشهد:
    // الصورة في الخلفية كاملة دون أي قص صناعي (تم إلغاء ctx.clip نهائياً)
    // القالب المعتمد يوضع كإطار علوي يحيط بالصورة بدقة ويغطي كافة الحواف الخارجية تلقائياً
    function render() {
      ctx.clearRect(0, 0, 1080, 1080);

      // الطبقة 1: الصورة الشخصية كاملة تغطي كامل الفراغ الداخلي دون أي قص يسبب الهلال
      if (userPhoto) {
        ctx.save();
        ctx.translate(photoTransform.x, photoTransform.y);
        ctx.rotate((photoTransform.rotation * Math.PI) / 180);
        ctx.scale(photoTransform.scale, photoTransform.scale);
        ctx.drawImage(userPhoto, -userPhoto.width / 2, -userPhoto.height / 2);
        ctx.restore();
      }

      // الطبقة 2: القالب كإطار علوي فوق الصورة
      if (templateImage) {
        ctx.drawImage(templateImage, 0, 0, 1080, 1080);
      }
    }

    // تفاعل السحب بالأصبع أو الماوس
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let initialPinch = null;
    let initialScale = 1;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = 1080 / rect.width;
      const sy = 1080 / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
    }

    canvasWrapper.addEventListener('mousedown', (e) => {
      if (!userPhoto) return;
      isDragging = true;
      const p = getCoords(e);
      dragStart.x = p.x - photoTransform.x;
      dragStart.y = p.y - photoTransform.y;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !userPhoto) return;
      const p = getCoords(e);
      photoTransform.x = p.x - dragStart.x;
      photoTransform.y = p.y - dragStart.y;
      render();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvasWrapper.addEventListener('touchstart', (e) => {
      if (!userPhoto) return;
      if (e.touches.length === 2) {
        isDragging = false;
        initialPinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = photoTransform.scale;
        return;
      }
      isDragging = true;
      const p = getCoords(e);
      dragStart.x = p.x - photoTransform.x;
      dragStart.y = p.y - photoTransform.y;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!userPhoto) return;
      if (e.touches.length === 2 && initialPinch) {
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        photoTransform.scale = Math.min(Math.max(initialScale * (dist / initialPinch), 0.1), 4);
        zoomSlider.value = photoTransform.scale;
        render();
        return;
      }
      if (!isDragging) return;
      e.preventDefault();
      const p = getCoords(e);
      photoTransform.x = p.x - dragStart.x;
      photoTransform.y = p.y - dragStart.y;
      render();
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
      initialPinch = null;
    });

    // أدوات التحكم بالزوم والتدوير
    zoomSlider.addEventListener('input', (e) => {
      photoTransform.scale = parseFloat(e.target.value);
      render();
    });

    rotateSlider.addEventListener('input', (e) => {
      photoTransform.rotation = parseFloat(e.target.value);
      render();
    });

    function stepZoom(delta) {
      photoTransform.scale = Math.min(Math.max(photoTransform.scale + delta, 0.1), 4);
      zoomSlider.value = photoTransform.scale;
      render();
    }

    function resetRotation() {
      photoTransform.rotation = 0;
      rotateSlider.value = 0;
      render();
    }

    function centerImage() {
      photoTransform.x = targetCircle.centerX;
      photoTransform.y = targetCircle.centerY;
      render();
    }

    function resetAll() {
      if (!userPhoto) return;
      const fit = Math.max(targetCircle.diameter / userPhoto.width, targetCircle.diameter / userPhoto.height);
      photoTransform.scale = fit * 1.15;
      photoTransform.x = targetCircle.centerX;
      photoTransform.y = targetCircle.centerY;
      photoTransform.rotation = 0;
      zoomSlider.value = photoTransform.scale;
      rotateSlider.value = 0;
      render();
    }

    // تنزيل النتيجة مباشرة
    function downloadFinalImage() {
      if (!userPhoto) return;
      render();

      try {
        const link = document.createElement('a');
        link.download = '26september_yemen_card.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        canvas.toBlob((blob) => {
          if (blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = '26september_yemen_card.png';
            link.href = url;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }
        }, 'image/png');
      }
    }
  </script>
</body>
</html>
